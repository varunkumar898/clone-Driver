[workspace]
resolver = "2"
members = [
    ".",
    "src-tauri",
]

[package]
name = "diskclone"
version = "0.1.0"
edition = "2021"
authors = ["DiskClone Authors"]
description = "High-performance, safety-critical Linux disk cloning application"
license = "MIT OR Apache-2.0"

[lib]
name = "diskclone"
path = "src/lib.rs"

[[bin]]
name = "diskclone"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "2.0"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Checksums
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
sha2 = "0.10"

# Concurrency primitives
crossbeam-queue = "0.3"

# Directory resolution
dirs = "5.0"

# Linux System & Storage
udev = "0.3"
nix = { version = "0.29", features = ["fs", "ioctl", "uio"] }
libc = "0.2"

# Partitioning
gpt = "4.1"
gpt_disk_io = "0.10"
mbrman = "0.6"

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }
tauri = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3.12"

[[test]]
name = "unit_state_machine"
path = "tests/unit/state_machine.rs"

[[test]]
name = "unit_device_filter"
path = "tests/unit/device_filter.rs"

[[test]]
name = "unit_checksum"
path = "tests/unit/checksum.rs"

[[test]]
name = "unit_buffer_pool"
path = "tests/unit/buffer_pool.rs"

[[test]]
name = "unit_error_handling"
path = "tests/unit/error_handling.rs"

[[test]]
name = "unit_partition_parser"

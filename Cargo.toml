[workspace]
resolver = "2"
members = [
    ".",
    "src-tauri",
]

[package]
name = "diskclone"
version = "0.1.0"
edition = "2021"
authors = ["DiskClone Authors"]
description = "High-performance, safety-critical Linux disk cloning application"
license = "MIT OR Apache-2.0"

[lib]
name = "diskclone"
path = "src/lib.rs"

[[bin]]
name = "diskclone"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "2.0"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Checksums
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
sha2 = "0.10"

# Linux System & Storage
udev = "0.3"
nix = { version = "0.29", features = ["fs", "ioctl", "uio"] }
libc = "0.2"

# Partitioning
gpt = "4.1"
gpt_disk_io = "0.10"
mbrman = "0.6"

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }

[dev-dependencies]
tempfile = "3.12"
